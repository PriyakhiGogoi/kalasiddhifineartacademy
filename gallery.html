    <link rel="stylesheet" href="style.css">

    <style>
        .gallery {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        .gallery h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .gallery-grid img:hover {
            transform: scale(1.02);
            transition: 0.3s;
        }
    </style>
</head>
