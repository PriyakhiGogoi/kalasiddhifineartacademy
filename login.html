<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Kala Siddhi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* additional login-specific styles */
        .login-card {
            background: #fff;
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo img {
            width: 100px;
            border-radius: 50%;
        }
        .login-card .logo h2 {
            margin-top: 12px;
            color: #1a1a4e;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group .input-wrapper input:focus {
            border-color: #0066ff;
            outline: none;
        }
        .form-group .input-wrapper .toggle-pwd {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
            transition: color 0.2s;
        }
        .form-group .input-wrapper .toggle-pwd:hover {
            color: #1a1a4e;
        }
        .btn-block {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 10px;
        }
        .change-credentials {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .change-credentials .toggle-link {
            color: #0066ff;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
            display: inline-block;
            margin-bottom: 15px;
        }
        .change-credentials .toggle-link:hover {
            color: #003d99;
        }
        .change-form {
            display: none;
        }
        .change-form.active {
            display: block;
        }
        .change-form .form-group {
            margin-bottom: 15px;
        }
        .message {
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
        }
        .message.error {
            color: #cc0000;
        }
        .message.success {
            color: #008000;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .login-footer a {
            color: #0066ff;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="background: linear-gradient(45deg, #82CAFF, #0000ff); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

    <div class="login-card">
        <div class="logo">
            <img src="img/logo.jpg" alt="Kala Siddhi Logo">
            <h2>Admin Login</h2>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <span class="toggle-pwd" id="togglePwd"><i class="fas fa-eye"></i></span>
                </div>
            </div>
            <button type="submit" class="btn btn-block">Login <i class="fas fa-arrow-right"></i></button>
            <div id="loginError" class="message error"></div>
        </form>

        <!-- Change Credentials -->
        <div class="change-credentials">
            <span class="toggle-link" id="toggleChangeForm"><i class="fas fa-cog"></i> Change Username / Password</span>
            <div class="change-form" id="changeForm">
                <div class="form-group">
                    <label for="newUsername">New Username</label>
                    <input type="text" id="newUsername" placeholder="Enter new username" class="form-group input-wrapper" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:12px;">
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:12px;">
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:12px;">
                </div>
                <button type="button" id="saveCredentialsBtn" class="btn btn-block" style="background: linear-gradient(45deg, #28a745, #218838);">Save Changes</button>
                <div id="changeMsg" class="message"></div>
            </div>
        </div>

        <div class="login-footer">
            <a href="index.html"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>

    <script>
        // ---- Helper functions for credentials ----
        function getStoredCredentials() {
            const stored = localStorage.getItem('adminCredentials');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        function setStoredCredentials(username, password) {
            localStorage.setItem('adminCredentials', JSON.stringify({ username, password }));
        }

        // Get current credentials (default: admin/admin123)
        function getCredentials() {
            const creds = getStoredCredentials();
            if (creds && creds.username && creds.password) {
                return creds;
            }
            // Default fallback
            return { username: 'admin', password: 'admin123' };
        }

        // ---- Toggle Password Visibility ----
        const togglePwd = document.getElementById('togglePwd');
        const passwordInput = document.getElementById('password');
        togglePwd.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // ---- Toggle Change Credentials Form ----
        const toggleLink = document.getElementById('toggleChangeForm');
        const changeForm = document.getElementById('changeForm');
        toggleLink.addEventListener('click', function() {
            changeForm.classList.toggle('active');
            // Clear messages
            document.getElementById('changeMsg').textContent = '';
            document.getElementById('changeMsg').className = 'message';
        });

        // ---- Save Credentials ----
        document.getElementById('saveCredentialsBtn').addEventListener('click', function() {
            const newUser = document.getElementById('newUsername').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();
            const msg = document.getElementById('changeMsg');

            if (!newUser || !newPass) {
                msg.textContent = '❌ Username and password cannot be empty.';
                msg.className = 'message error';
                return;
            }
            if (newPass !== confirmPass) {
                msg.textContent = '❌ Passwords do not match.';
                msg.className = 'message error';
                return;
            }
            if (newPass.length < 6) {
                msg.textContent = '❌ Password must be at least 6 characters.';
                msg.className = 'message error';
                return;
            }

            setStoredCredentials(newUser, newPass);
            msg.textContent = '✅ Credentials updated successfully!';
            msg.className = 'message success';
            // Clear fields
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            // Optionally close the form after a delay
            setTimeout(() => {
                changeForm.classList.remove('active');
                msg.textContent = '';
            }, 2500);
        });

        // ---- Login Handler ----
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const enteredUser = document.getElementById('username').value.trim();
            const enteredPass = document.getElementById('password').value.trim();
            const creds = getCredentials();
            const errorDiv = document.getElementById('loginError');

            if (enteredUser === creds.username && enteredPass === creds.password) {
                // Login success
                localStorage.setItem('adminLoggedIn', 'true');
                // Redirect to gallery or results (prefer gallery)
                const referrer = document.referrer || 'gallery.html';
                if (referrer.includes('gallery') || referrer.includes('results') || referrer.includes('login')) {
                    window.location.href = 'gallery.html';
                } else {
                    window.location.href = referrer;
                }
            } else {
                errorDiv.textContent = '❌ Invalid username or password.';
                errorDiv.className = 'message error';
            }
        });

        // ---- Pre-fill? No, we don't want any default values. ----
        // Leave inputs empty.
    </script>

</body>
</html>
