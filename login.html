<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Kala Siddhi</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            background: linear-gradient(45deg, #82CAFF, #0000ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }
        .login-card {
            background: #fff;
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo img {
            width: 100px;
            border-radius: 50%;
        }
        .login-card .logo h2 {
            margin-top: 12px;
            color: #1a1a4e;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .input-wrapper input:focus {
            border-color: #0066ff;
            outline: none;
        }
        .toggle-pwd {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
        }
        .toggle-pwd:hover {
            color: #1a1a4e;
        }
        .btn-block {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            margin-top: 10px;
        }
        .message {
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
        }
        .message.error {
            color: #cc0000;
        }
        .message.success {
            color: #008000;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .login-footer a {
            color: #0066ff;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <img src="img/logo.jpg" alt="Kala Siddhi Logo" />
            <h2>Admin Login</h2>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required />
                    <span class="toggle-pwd" id="togglePwd"><i class="fas fa-eye"></i></span>
                </div>
            </div>
            <button type="submit" class="btn btn-block">Login <i class="fas fa-arrow-right"></i></button>
            <div id="loginError" class="message error"></div>
        </form>

        <div class="login-footer">
            <a href="index.html"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('togglePwd').addEventListener('click', function() {
            const input = document.getElementById('password');
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');

            // Change these credentials if you like
            const validUser = 'admin';
            const validPass = 'admin123';

            if (username === validUser && password === validPass) {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'gallery.html';
            } else {
                errorDiv.textContent = '❌ Invalid username or password.';
                errorDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
